; =============================================================================
; YouTube Shorts Generator - settings.ini
; =============================================================================
; This file controls every user-tunable aspect of a batch run. Relative
; paths are resolved against the folder this file lives in, so the whole
; project folder (or a PyInstaller-built distribution containing this
; file next to the .exe) can be moved/copied as a unit.
; =============================================================================

[paths]
; Folder scanned for source videos (.mp4, .mov, .m4v, .avi, .mkv, .webm).
; Not scanned recursively -- keep it a flat drop folder.
input_dir = input

; Folder finished vertical videos are written to.
output_dir = output

; Folder timestamped run logs and batch summaries are written to.
log_dir = logs

; Leave as "ffmpeg"/"ffprobe" (the default) and you shouldn't need to
; touch this at all: if you're running the Windows .exe built via
; build_tools/build_exe.py, it has its own copy of ffmpeg/ffprobe built
; in and finds it automatically -- no system install needed. Only set
; an absolute path here if you specifically want to point at a
; different FFmpeg install than the bundled/PATH one.
ffmpeg_path = ffmpeg
ffprobe_path = ffprobe


[output]
; Output canvas size. 1080x1920 (9:16) is the standard YouTube
; Shorts / TikTok / Instagram Reels vertical format.
canvas_width = 1080
canvas_height = 1920

; 0 = keep the source frame rate. Set e.g. 30 or 60 to force a specific
; output frame rate.
output_fps = 0

; Leave video_bitrate empty to use constant-quality (crf) encoding,
; which is the recommended default. Set something like "8M" to force a
; specific average bitrate instead.
video_bitrate =
audio_bitrate = 192k

; libx264 constant-rate-factor quality target: lower = higher quality
; and larger files. 18-23 is a typical "visually lossless to very good"
; range for social video. Defaults to 18 (near-visually-lossless) since
; quality, not file size, is the priority for this project.
crf = 18

; libx264 speed/efficiency trade-off: ultrafast, superfast, veryfast,
; faster, fast, medium, slow, slower, veryslow. Slower presets spend
; more CPU time finding a better quality-per-bit trade-off; "slow" is a
; good quality-first default. Drop to "fast" or "veryfast" if you're
; processing a large batch and render time matters more than squeezing
; out the last bit of quality.
preset = slow

container_extension = mp4
output_suffix = _short


[background]
; One of: auto_blur_video, blurred_image, sharp_image, solid_color,
;         gradient, split_top_bottom, branding_template
;
; auto_blur_video is the default and needs NO background image or any
; other external asset: it takes a landscape (16:9) source video and
; converts it straight to a vertical (9:16) Short using a blurred copy
; of the same clip as the backdrop. The visible subject is always fit
; inside the canvas at full quality (high-quality Lanczos downscaling,
; never cropped, never upscaled) -- only the blurred backdrop behind it
; is resampled aggressively. This is the right choice if you just want
; to convert existing landscape YouTube videos to Shorts with nothing
; extra to configure.
;
; The other modes below (blurred_image, sharp_image, branding_template)
; are still available if you want a custom look and are willing to
; supply a background image / branding template of your own.
fit_mode = auto_blur_video

; Only used by fit_mode = blurred_image / sharp_image.
background_image = assets/sample_background.jpg

; Blur strength used by blurred_image, auto_blur_video, and
; split_top_bottom (higher = blurrier).
blur_sigma = 20

; Only used by fit_mode = solid_color. Accepts ffmpeg color syntax,
; e.g. 0xRRGGBB or a named color like "black".
solid_color = 0x1A1A2E

; Only used by fit_mode = gradient.
gradient_color_start = 0x1A1A2E
gradient_color_end = 0x16213E
gradient_direction = vertical

; Only used by fit_mode = branding_template: a canvas-sized PNG with a
; transparent "hole" where the video should show through.
branding_template_path = assets/branding_templates/sample_template.png
; Rectangle (in output-canvas pixels) the video is fit into -- this
; must match the transparent hole cut into branding_template_path.
branding_safe_x = 0
branding_safe_y = 156
branding_safe_width = 1080
branding_safe_height = 1608


[batch]
; If false (default), a source file whose output already exists is
; skipped instead of re-rendered -- this doubles as "resume an
; interrupted batch": just re-run and already-finished files are left
; alone.
overwrite_existing = false

; Kept for forward-compatibility / documentation of intent: the batch
; pipeline always skips a failing file and continues with the rest: see
; pipeline.py. Setting this to false is not currently honored, so a
; future "abort whole batch on first error" mode can be added without
; a breaking settings.ini change.
continue_on_error = true

; If true, the source file is deleted after it has been rendered
; successfully. Leave false unless you are sure you don't need the
; originals.
delete_source_on_success = false


[plugins]
; Comma-separated list of plugin keys to enable. Empty by default.
; Available keys: watermark, ai_metadata (see the [plugin:...] sections
; below for each one's own settings). See src/shorts_generator/plugins/
; for the extension mechanism used to add further modules later.
;
; Example: enabled = ai_metadata
enabled =


[plugin:ai_metadata]
; AI-generated title / description / hashtag suggestions for every
; rendered Short, written as a <name>.metadata.json / .metadata.txt
; sidecar next to the output video. Requires an OpenAI API key and
; calls OpenAI's API (billed separately, per call) -- see
; src/shorts_generator/plugins/ai_metadata.py for full details.
;
; Strongly prefer setting the OPENAI_API_KEY environment variable
; instead of pasting a key here -- this field is only a convenience
; fallback and this file may end up copied/zipped/shared.
api_key =
; Vision-capable OpenAI model to use.
model = gpt-4o-mini
; How many evenly-spaced frames to sample from each video and send to
; the model. More frames = better content understanding but higher API
; cost per video.
frame_count = 5
max_output_tokens = 900


[plugin:watermark]
; Reference/example plugin (see plugins/examples.py) -- burns a static
; logo image into the bottom-right corner. Leave image_path empty (or
; don't enable "watermark" above) to leave this off; it's included
; mainly as a working template for future overlay-style modules
; (animated subscribe button, branding stickers, etc.).
image_path =
margin = 24
